[project]
name = "qtalk-bot"
version = "0.1.0"
description = "基于 pyqbot 的 QQ 聊天助手"
authors = [{ name = "capric98" }]
requires-python = ">=3.14"
dependencies = [
    "pyqbot",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
extend-select = [
    "I",     # import 排序
    "N",     # 命名
    "UP",    # 使用新语法
    "B",     # 常见 bug
    "C4",    # 推导式写法
    "SIM",   # 可简化的写法
    "ASYNC", # async 误用
    "PT",    # pytest 写法
    "T20",   # 禁止遗留 print
    "RUF",
]
ignore = [
    "RUF001", # 以下三条会把中文全角标点当成误用字符
    "RUF002",
    "RUF003",
]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-markers", "--strict-config"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
xfail_strict = true
filterwarnings = ["error"]

[tool.uv.sources]
pyqbot = { path = "../pyqbot", editable = true }

[dependency-groups]
dev = [
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]
